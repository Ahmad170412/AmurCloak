<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="TigerBlur">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202a"/>
      <stop offset="1" stop-color="#222e3b"/>
    </linearGradient>
    <linearGradient id="tb-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f9fa"/>
      <stop offset="0.72" stop-color="#f0dfc9"/>
      <stop offset="1" stop-color="#c97a2b"/>
    </linearGradient>
    <radialGradient id="tb-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c97a2b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c97a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="80" rx="14" fill="url(#tb-bg)"/>
  <circle cx="44" cy="40" r="58" fill="url(#tb-glow)"/>

  <!-- the app's own mark: three tiger stripes, roll-tilted like the mask -->
  <rect x="18" y="18" width="44" height="44" rx="11" fill="#1d2733" stroke="#c97a2b" stroke-opacity="0.55"/>
  <g fill="#c97a2b" transform="translate(26,26) scale(0.875)">
    <g transform="rotate(-12 16 16)">
      <rect x="7" y="8" width="3.2" height="16" rx="1.6"/>
      <rect x="13" y="5" width="3.2" height="22" rx="1.6" opacity="0.72"/>
      <rect x="19" y="10" width="3.2" height="12" rx="1.6" opacity="0.46"/>
    </g>
  </g>

  <text x="76" y="38" font-family="ui-serif, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" letter-spacing="-0.4" fill="url(#tb-word)">TigerBlur</text>

  <line x1="77" y1="47" x2="196" y2="47" stroke="#3a4a59" stroke-width="1"/>

  <text x="77" y="63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="0.2" fill="#8698a3">local face redaction for photos</text>

  <rect x="222" y="26" width="82" height="19" rx="9.5" fill="#c97a2b" fill-opacity="0.14" stroke="#c97a2b" stroke-opacity="0.45"/>
  <circle cx="234" cy="35.5" r="3" fill="#3f6b52"/>
  <text x="242" y="39" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#e0a163">no network</text>
</svg>

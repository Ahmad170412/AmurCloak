[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amurcloak"
version = "0.9.0"
description = "Local face redaction for photos. Nothing leaves this machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad170412" }]
requires-python = ">=3.11"
keywords = ["privacy", "redaction", "face-detection", "photos", "heic", "offline"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]

# Deliberately tiny: no torch, no onnxruntime, no ffmpeg binary. YuNet runs
# through the DNN module OpenCV already ships, and every entry here has prebuilt
# wheels on PyPI for macOS, Windows and Linux.
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.urls]
Homepage = "https://github.com/Ahmad170412/AmurCloak"
Repository = "https://github.com/Ahmad170412/AmurCloak"
Issues = "https://github.com/Ahmad170412/AmurCloak/issues"
Changelog = "https://github.com/Ahmad170412/AmurCloak/releases"

[project.scripts]
amurcloak = "amurcloak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amurcloak"]

[tool.ruff]
# 100 rather than the 88 that is common elsewhere: several call sites here carry
# a full argument list plus an inline comment, and wrapping them makes the
# pipeline harder to read, not easier.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PERF", # perflint
    "RUF",  # ruff-specific
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "LOG",  # logging
    "G",    # logging format
    "ISC",  # implicit string concatenation
    "N",    # pep8-naming
    "DTZ",  # naive datetimes
    "PL",   # pylint
    # Enabled on purpose for a privacy tool. A broad `except` that swallows a
    # failure can turn "the redaction threw" into output that merely looks
    # redacted, so every blind catch here has to say why it is safe.
    "BLE",  # flake8-blind-except
    "S",    # flake8-bandit
]
ignore = [
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements - these three are length heuristics, and
               # the functions they fire on are linear steps or keyword-only
               # configuration objects that read better left whole
    "PLR2004", # magic value in comparison - the tunables already live as named
               # constants at the top of presets.py and sessions.py; repeating
               # them in each comparison would not make the intent clearer
    "PLC0415", # import-outside-top-level - deliberate in detector.ensure_model,
               # where the project's one network import stays inside the single
               # function that may perform it, behind --allow-download
]

[tool.ruff.lint.isort]
# Keep `from .presets import Settings, build as build_settings` on one line
# instead of splitting the alias onto its own statement.
combine-as-imports = true
